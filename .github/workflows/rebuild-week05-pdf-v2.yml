name: Rebuild Week 5 PDF v2

on:
  push:
    branches:
      - student/Jonathan
    paths:
      - .github/workflows/rebuild-week05-pdf-v2.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: student/Jonathan
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save marked playwright
      - name: Build Week 5 PDF
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/build-student-pdf.cjs weekly/week05/01-student-worksheet.md
      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly/week05/01-student-worksheet.pdf
          if git diff --cached --quiet; then
            echo "PDF already matches."
          else
            git commit -m "Regenerate Week 5 student PDF"
            git push origin HEAD:student/Jonathan
          fi
