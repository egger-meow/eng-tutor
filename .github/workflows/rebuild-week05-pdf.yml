name: Rebuild Week 5 PDF

on:
  push:
    branches:
      - student/Jonathan
    paths:
      - .github/workflows/rebuild-week05-pdf.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Jonathan branch
        uses: actions/checkout@v4
        with:
          ref: student/Jonathan

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PDF build dependencies
        run: npm install --no-save marked playwright

      - name: Build Week 5 student PDF
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/build-student-pdf.cjs weekly/week05/01-student-worksheet.md

      - name: Commit regenerated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly/week05/01-student-worksheet.pdf
          if git diff --cached --quiet; then
            echo "PDF already matches generated output."
          else
            git commit -m "Regenerate Week 5 student PDF"
            git push origin HEAD:student/Jonathan
          fi
